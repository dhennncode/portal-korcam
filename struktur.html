<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Struktur Organisasi Korcam — Kecamatan Kedewan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="shared/css/design-system.css">
  <style>
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 22px 20px 72px;
    }

    .topbar {
      padding: 0;
      margin-bottom: 22px;
    }

    .kop-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 4px;
    }

    .kop-brand img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      padding: 5px;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, .4);
      object-fit: contain;
      flex-shrink: 0;
    }

    .section-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-400);
      margin: 38px 2px 14px;
    }

    .struktur-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    @media (max-width: 720px) {
      .struktur-grid {
        grid-template-columns: 1fr;
      }
    }

    .person-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 26px 20px;
      text-align: center;
      box-shadow: var(--shadow-card);
    }

    .person-photo-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 14px;
      position: relative;
    }

    .person-photo {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--gold-300);
      display: block;
      position: absolute;
      inset: 0;
    }

    .person-monogram {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: var(--gradient-maroon);
      color: var(--gold-100);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 26px;
      align-items: center;
      justify-content: center;
      border: 3px solid var(--gold-300);
      position: absolute;
      inset: 0;
      display: none;
    }

    .person-role {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold-600);
      margin-bottom: 5px;
    }

    .person-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      color: var(--ink-900);
    }

    .foot {
      margin-top: 44px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--ink-400);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .foot img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar"><a class="back-link" href="index.html">&larr; Menu Utama</a></div>

    <header class="kop">
      <div class="kop-brand">
        <img src="shared/img/logo-korcam.png" alt="Logo Korcam KKM IKIP PGRI Bojonegoro">
        <p class="kop-eyebrow" style="margin:0;">KORCAM KKM &middot; IKIP PGRI Bojonegoro</p>
      </div>
      <h1 class="kop-title">Struktur Organisasi<br>Korcam Kecamatan Kedewan</h1>
      <p class="kop-sub">Susunan penanggung jawab pelaksanaan KKM IKIP PGRI Bojonegoro Tahun 2026 di tingkat kecamatan.
      </p>
      <div class="kop-stripe"></div>
    </header>

    <p class="section-label">Pengurus</p>
    <div class="struktur-grid" id="struktur-grid"></div>

    <div class="foot">
      <img src="shared/img/logo-korcam.png" alt="">
      <span>KOORDINATOR KECAMATAN KKM &copy; 2026 &middot; IKIP PGRI Bojonegoro</span>
    </div>

    <script>
      const TIM_KORCAM = [
        { peran: "Ketua", nama: "Dedy Indra Setiawan", foto: "foto/dedy-indra-setiawan.jpg" },
        { peran: "Sekretaris", nama: "Adinda Putri Handayani", foto: "foto/adinda-putri-handayani.jpg" },
        { peran: "Bendahara", nama: "Johan Dwi Setyo Utomo", foto: "foto/johan-dwi-murtopo.jpg" },
      ];

      function escapeHtml(str) { const div = document.createElement("div"); div.textContent = str == null ? "" : String(str); return div.innerHTML; }

      function renderStruktur() {
        const grid = document.getElementById("struktur-grid");
        grid.innerHTML = TIM_KORCAM.map((p) => {
          const initials = p.nama.split(" ").slice(0, 2).map(w => w[0]).join("").toUpperCase();
          return `
        <div class="person-card">
          <div class="person-photo-wrap">
            <img class="person-photo" src="${p.foto}" alt="Foto ${escapeHtml(p.nama)}"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div class="person-monogram">${initials}</div>
          </div>
          <div class="person-role">${escapeHtml(p.peran)}</div>
          <div class="person-name">${escapeHtml(p.nama)}</div>
        </div>`;
        }).join("");
      }

      renderStruktur();
    </script>
</body>

</html>
