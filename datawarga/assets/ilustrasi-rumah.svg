<svg width="360" height="320" viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi rumah">
  <defs>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9C2233"/>
      <stop offset="100%" stop-color="#641320"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF5F5"/>
      <stop offset="100%" stop-color="#F3E6E7"/>
    </linearGradient>
    <linearGradient id="doorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#A6801C"/>
    </linearGradient>
  </defs>

  <!-- tanah / dasar -->
  <ellipse cx="180" cy="285" rx="150" ry="14" fill="#641320" opacity="0.07"/>

  <!-- pagar kecil kiri -->
  <g stroke="#D8C0C3" stroke-width="4" stroke-linecap="round">
    <line x1="26" y1="252" x2="26" y2="278"/>
    <line x1="46" y1="248" x2="46" y2="278"/>
    <line x1="66" y1="252" x2="66" y2="278"/>
    <line x1="20" y1="258" x2="72" y2="258"/>
  </g>
  <!-- pagar kecil kanan -->
  <g stroke="#D8C0C3" stroke-width="4" stroke-linecap="round">
    <line x1="290" y1="252" x2="290" y2="278"/>
    <line x1="310" y1="248" x2="310" y2="278"/>
    <line x1="330" y1="252" x2="330" y2="278"/>
    <line x1="284" y1="258" x2="336" y2="258"/>
  </g>

  <!-- pohon kecil -->
  <g>
    <rect x="298" y="196" width="8" height="30" rx="3" fill="#8A5A16"/>
    <circle cx="302" cy="182" r="26" fill="#157A4F" opacity="0.85"/>
    <circle cx="286" cy="196" r="18" fill="#157A4F" opacity="0.75"/>
    <circle cx="320" cy="196" r="18" fill="#157A4F" opacity="0.75"/>
  </g>

  <!-- cerobong -->
  <rect x="240" y="70" width="20" height="46" fill="#7E1A29"/>
  <rect x="236" y="66" width="28" height="10" rx="2" fill="#4A0E18"/>

  <!-- atap -->
  <polygon points="180,48 300,140 60,140" fill="url(#roofGrad)"/>
  <polygon points="180,48 300,140 282,140 180,64 78,140 60,140" fill="#300910" opacity="0.35"/>

  <!-- badan rumah -->
  <rect x="80" y="140" width="200" height="130" rx="6" fill="url(#wallGrad)" stroke="#E9D6D8" stroke-width="2"/>

  <!-- teras / undakan -->
  <rect x="70" y="270" width="220" height="10" rx="3" fill="#D8C0C3" opacity="0.6"/>

  <!-- pintu -->
  <rect x="158" y="196" width="44" height="74" rx="4" fill="url(#doorGrad)"/>
  <circle cx="192" cy="234" r="3" fill="#3A2A05"/>

  <!-- jendela kiri -->
  <rect x="102" y="172" width="38" height="38" rx="4" fill="#B92C3E" opacity="0.14" stroke="#9C2233" stroke-width="2.5"/>
  <line x1="121" y1="172" x2="121" y2="210" stroke="#9C2233" stroke-width="2.5"/>
  <line x1="102" y1="191" x2="140" y2="191" stroke="#9C2233" stroke-width="2.5"/>

  <!-- jendela kanan -->
  <rect x="220" y="172" width="38" height="38" rx="4" fill="#B92C3E" opacity="0.14" stroke="#9C2233" stroke-width="2.5"/>
  <line x1="239" y1="172" x2="239" y2="210" stroke="#9C2233" stroke-width="2.5"/>
  <line x1="220" y1="191" x2="258" y2="191" stroke="#9C2233" stroke-width="2.5"/>

  <!-- aksen garis emas di bawah atap -->
  <rect x="80" y="140" width="200" height="5" fill="#C9A227"/>
</svg>
